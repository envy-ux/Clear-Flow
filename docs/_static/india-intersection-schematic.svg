<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Clear Flow synthetic mixed-traffic intersection schematic</title>
  <desc id="desc">An illustrative four-arm junction with two simulated flows: north to south and west to east. Vehicle types shown include two-wheelers, auto-rickshaws, cars, buses and trucks. This is a schematic, not a simulation screenshot.</desc>
  <rect width="1200" height="650" rx="24" fill="#F5F9FC"/>
  <text x="58" y="62" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#10283F">Clear Flow · Synthetic test intersection</text>
  <text x="58" y="96" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#587085">Four-arm SUMO network · illustrative traffic demand · not field-calibrated</text>
  <!-- road bed -->
  <rect x="395" y="130" width="410" height="460" rx="5" fill="#263B4D"/>
  <rect x="120" y="260" width="960" height="220" rx="5" fill="#263B4D"/>
  <!-- road edge lines -->
  <g stroke="#8FA0AE" stroke-width="3" fill="none" stroke-dasharray="11 10" opacity="0.85">
    <path d="M 520 130 V 260 M 680 130 V 260 M 520 480 V 590 M 680 480 V 590"/>
    <path d="M 120 315 H 395 M 120 425 H 395 M 805 315 H 1080 M 805 425 H 1080"/>
  </g>
  <!-- intersection box and stop bars -->
  <rect x="395" y="260" width="410" height="220" fill="#314B5F"/>
  <g stroke="#F4F8FB" stroke-width="7" opacity="0.95">
    <path d="M 455 250 H 745"/><path d="M 385 315 V 425"/>
  </g>
  <!-- active traffic flows -->
  <g fill="none" stroke="#42D3B0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 600 164 V 236"/><path d="M 600 504 V 565"/>
    <path d="M 160 370 H 350"/><path d="M 850 370 H 1030"/>
  </g>
  <g fill="#42D3B0">
    <path d="M 600 246 l -13 -20 h 26 z" transform="rotate(180 600 236)"/>
    <path d="M 600 565 l -13 -20 h 26 z"/>
    <path d="M 350 370 l -20 -13 v 26 z"/>
    <path d="M 1030 370 l -20 -13 v 26 z"/>
  </g>
  <!-- signal cabinet and lights -->
  <g transform="translate(750 280)">
    <rect x="0" y="0" width="35" height="75" rx="9" fill="#101E2B" stroke="#D7E2EA" stroke-width="2"/>
    <circle cx="17.5" cy="17" r="7" fill="#E45656"/><circle cx="17.5" cy="37" r="7" fill="#E8B44E"/><circle cx="17.5" cy="57" r="7" fill="#42D3B0"/>
  </g>
  <g transform="translate(410 390)">
    <rect x="0" y="0" width="35" height="75" rx="9" fill="#101E2B" stroke="#D7E2EA" stroke-width="2"/>
    <circle cx="17.5" cy="17" r="7" fill="#E45656"/><circle cx="17.5" cy="37" r="7" fill="#E8B44E"/><circle cx="17.5" cy="57" r="7" fill="#42D3B0"/>
  </g>
  <!-- vehicle tokens -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">
    <g transform="translate(560 180)"><rect x="-18" y="-10" width="36" height="20" rx="7" fill="#DCEBFF" stroke="#6EA0D9" stroke-width="2"/><circle cx="-10" cy="10" r="4" fill="#1E3448"/><circle cx="10" cy="10" r="4" fill="#1E3448"/><text x="0" y="4" font-size="11" fill="#244E7B">2W</text></g>
    <g transform="translate(640 204)"><rect x="-21" y="-11" width="42" height="22" rx="7" fill="#F9D88B" stroke="#D7A53F" stroke-width="2"/><text x="0" y="4" font-size="11" fill="#5F4307">AUTO</text></g>
    <g transform="translate(570 532)"><rect x="-26" y="-12" width="52" height="24" rx="7" fill="#CFE9DF" stroke="#55A48A" stroke-width="2"/><text x="0" y="4" font-size="11" fill="#155C48">BUS</text></g>
    <g transform="translate(260 345)"><rect x="-25" y="-11" width="50" height="22" rx="7" fill="#DCEBFF" stroke="#6EA0D9" stroke-width="2"/><text x="0" y="4" font-size="11" fill="#244E7B">CAR</text></g>
    <g transform="translate(935 396)"><rect x="-27" y="-12" width="54" height="24" rx="6" fill="#E6DDFC" stroke="#9B82D3" stroke-width="2"/><text x="0" y="4" font-size="10" fill="#553C8B">TRUCK</text></g>
  </g>
  <!-- callouts -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="52" y="145" width="260" height="76" rx="14" fill="#FFFFFF" stroke="#D6E2EB"/>
    <text x="72" y="175" font-size="16" font-weight="700" fill="#10283F">North → South</text>
    <text x="72" y="199" font-size="13" fill="#587085">Synthetic route flow</text>
    <rect x="866" y="145" width="282" height="76" rx="14" fill="#FFFFFF" stroke="#D6E2EB"/>
    <text x="886" y="175" font-size="16" font-weight="700" fill="#10283F">West → East</text>
    <text x="886" y="199" font-size="13" fill="#587085">Synthetic route flow</text>
    <rect x="52" y="526" width="370" height="75" rx="14" fill="#FFFFFF" stroke="#D6E2EB"/>
    <text x="72" y="555" font-size="15" font-weight="700" fill="#10283F">Vehicle classes</text>
    <text x="72" y="579" font-size="13" fill="#587085">Two-wheelers · autos · cars · buses · trucks</text>
    <rect x="820" y="526" width="328" height="75" rx="14" fill="#FFFFFF" stroke="#D6E2EB"/>
    <text x="840" y="555" font-size="15" font-weight="700" fill="#10283F">Important limitation</text>
    <text x="840" y="579" font-size="13" fill="#587085">Illustrative, not an Indian field model</text>
  </g>
</svg>